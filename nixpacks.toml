[phases.setup]
nixPkgs = ["...", "php82", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.pdo_pgsql"]

[phases.build]
cmds = [
    "composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]
